schema_version: 1

context:
  version: 0.16.1

package:
  name: gopls
  version: ${{ version }}

source:
  url: https://github.com/golang/tools/archive/gopls/v${{ version }}.tar.gz
  sha256: 0805bb9d3bfa51334b4d45a3182daea3e77ecbe27f4ddc672841ec72f63ed20a

build:
  number: 1

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gopls --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - license-files/
  summary: Language server for the Go language
  homepage: https://github.com/golang/tools/tree/master/gopls
  repository: https://github.com/golang/tools/tree/master/gopls

extra:
  recipe-maintainers:
    - danielnachun
