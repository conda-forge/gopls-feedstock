schema_version: 1

context:
  version: 0.23.0

package:
  name: gopls
  version: ${{ version }}

source:
  url: https://github.com/golang/tools/archive/gopls/v${{ version }}.tar.gz
  sha256: 1ba41875b918db73c6a409ad8f552b85f72dfeea43ffb541b798322ff6b4152b

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gopls --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - license-files/
  summary: Language server for the Go language
  homepage: https://github.com/golang/tools/tree/master/gopls
  repository: https://github.com/golang/tools/tree/master/gopls

extra:
  recipe-maintainers:
    - trim21
    - danielnachun
