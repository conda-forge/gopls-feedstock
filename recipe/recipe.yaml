schema_version: 1

context:
  version: "0.21.1"

package:
  name: gopls
  version: ${{ version }}

source:
  url: https://github.com/golang/tools/archive/gopls/v${{ version }}.tar.gz
  sha256: af211e00c3ffe44fdf2dd3efd557e580791e09f8dbb4284c917bd120bc3c8f9c

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gopls --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - license-files/
  summary: Language server for the Go language
  homepage: https://github.com/golang/tools/tree/master/gopls
  repository: https://github.com/golang/tools/tree/master/gopls

extra:
  recipe-maintainers:
    - danielnachun
